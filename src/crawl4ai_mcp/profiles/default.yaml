# Default profile: applied as base layer for every crawl.
# All other profiles are merged on top of these values.
# page_timeout is in milliseconds (CrawlerRunConfig native unit).
wait_until: domcontentloaded
page_timeout: 60000 # 60 seconds
# Routed to PruningContentFilter, not to CrawlerRunConfig. (An older comment
# here said CrawlerRunConfig's default was 200; it is 1 in crawl4ai 0.9.2, so
# nothing is being "preserved" by this value. It tunes the content filter.)
word_count_threshold: 10
